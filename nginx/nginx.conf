events {}

http {
    # HTTP block – redirect all traffic to HTTPS
    server {
        listen 80;
        server_name url-shortener-service.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # HTTPS block – production configuration
    server {
        listen 443 ssl;
        http2 on;
        server_name url-shortener-service.duckdns.org;

        # Let's Encrypt certificates (mounted via docker‑compose)
        ssl_certificate /etc/letsencrypt/live/url-shortener-service.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/url-shortener-service.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Optional security headers (can be removed if undesired)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
