events {}

http {
    server {
        # Nginx listens on port 80 — the standard HTTP port.
        listen 80;

        location / {
            # Forward every incoming request to the Spring Boot container.
            # "app" is the Docker Compose service name — Docker's internal DNS
            # resolves it to the container's IP automatically.
            proxy_pass http://app:8080;

            # Pass the real client IP and host header to Spring Boot.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
