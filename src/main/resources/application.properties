# ============================================================
# URL Shortener Service — Application Properties
# Override any value via environment variable (Spring Boot
# externalized config: env var takes priority over this file).
# ============================================================

# --- Server --------------------------------------------------
server.port=8080

# --- DataSource (PostgreSQL) ---------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP Connection Pool --------------------------------
spring.datasource.hikari.pool-name=UrlShortenerPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate -----------------------------------------
# "validate" — Hibernate validates schema against entity; Flyway owns DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway --------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# --- Application-specific ------------------------------------
# Base URL prepended to shortCode when building the full short URL in responses
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.short-code.min-length=6

# --- Logging -------------------------------------------------
logging.level.root=INFO
logging.level.com.shrey.urlshortener=DEBUG

# --- RFC 7807 Problem Details (Spring Boot 3 native) ---------
spring.mvc.problemdetails.enabled=true
